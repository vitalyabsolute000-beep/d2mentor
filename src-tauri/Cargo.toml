[package]
name = "d2mentor"
version = "0.1.1"
description = "D2Mentor — quiet Dota 2 overlay coach (GSI + OpenDota)"
authors = ["you"]
edition = "2024"

[lib]
name = "d2mentor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
ureq = { version = "2.12", features = ["json"] }
winreg = "0.52"
rand = "0.8"
hex = "0.4"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
