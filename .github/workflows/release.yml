name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and attach release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "D2Mentor ${{ github.ref_name }}"
          releaseBody: |
            Windows x64 build.

            - Unsigned binary: SmartScreen may warn. Builds are produced from this repository by GitHub Actions.
            - Requires WebView2 (preinstalled on Windows 11).
            - Dota 2 must run in Borderless Windowed mode for the overlay to be visible.
          releaseDraft: true
          prerelease: false
